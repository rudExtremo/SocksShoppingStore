name: Tests and Allure Report

on:
  push:
    branches: [ dev, main ]
  workflow_dispatch:
    inputs:
      run_ui:
        description: "Run UI tests"
        required: false
        default: "false"

jobs:
  dev-tests:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore SocksShoppingStore/SocksShoppingStore.sln
      - name: Run fast tests (Unit + Integration + API-Smoke)
        env:
          BASE_URL: http://127.0.0.1:5123
          USE_TEST_FACTORY: '1'
          RUN_UI_TESTS: '0'
        run: |
          dotnet test SocksShoppingStore.Tests/SocksShoppingStore.Tests.csproj -c Release --filter "TestCategory=Unit|TestCategory=Integration|TestCategory=API-Smoke" --logger "trx;LogFileName=dev.trx"
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-dev
          path: |
            allure-results
            **/allure-results

  main-tests:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore SocksShoppingStore/SocksShoppingStore.sln
      - name: Start app (HTTP)
        run: |
          nohup bash -c "ASPNETCORE_URLS=http://127.0.0.1:5123 dotnet run --project SocksShoppingStore/SocksShoppingStore.csproj --no-build" >/dev/null 2>&1 &
          for i in {1..30}; do nc -z 127.0.0.1 5123 && echo up && break || sleep 1; done
      - name: Run full test suite (incl. UI)
        env:
          BASE_URL: http://127.0.0.1:5123
          RUN_UI_TESTS: '1'
          IGNORE_CERT_ERRORS: '0'
          USE_TEST_FACTORY: '1'
        run: |
          dotnet test SocksShoppingStore.Tests/SocksShoppingStore.Tests.csproj -c Release --logger "trx;LogFileName=main.trx" \
            /p:CollectCoverage=true \
            /p:CoverletOutput=./SocksShoppingStore.Tests/TestResults/Coverage/coverage \
            /p:CoverletOutputFormat=cobertura%2Copencover
      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@v1.8
        with:
          allure_results: '**/allure-results'
          allure_report: allure-report
          github_run_num: ${{ github.run_number }}
      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: success()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages
      - name: Verify Allure Pages
        if: success()
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          REPO_NAME=${GITHUB_REPOSITORY#*/}
          URL="https://${OWNER}.github.io/${REPO_NAME}"
          echo "Checking ${URL}..."
          for i in {1..20}; do
            if curl -fsSL "$URL/index.html" >/dev/null; then echo "Allure available at $URL"; exit 0; fi
            sleep 3
          done
          echo "Allure report not reachable at $URL" >&2
          exit 1
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-main
          path: |
            SocksShoppingStore.Tests/TestResults/Coverage
            **/coverage.opencover.xml

  manual-ui:
    if: github.event_name == 'workflow_dispatch' && inputs.run_ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore SocksShoppingStore/SocksShoppingStore.sln
      - name: Start app (HTTP)
        run: |
          nohup bash -c "ASPNETCORE_URLS=http://127.0.0.1:5123 dotnet run --project SocksShoppingStore/SocksShoppingStore.csproj --no-build" >/dev/null 2>&1 &
          for i in {1..30}; do nc -z 127.0.0.1 5123 && echo up && break || sleep 1; done
      - name: Run UI smoke tests
        env:
          BASE_URL: http://127.0.0.1:5123
          RUN_UI_TESTS: '1'
          IGNORE_CERT_ERRORS: '0'
        run: |
          dotnet test SocksShoppingStore.Tests/SocksShoppingStore.Tests.csproj -c Release --filter "TestCategory=UI-Smoke" --logger "trx;LogFileName=ui.trx"
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui
          path: |
            allure-results
            **/allure-results

