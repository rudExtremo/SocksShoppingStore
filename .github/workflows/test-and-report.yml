name: Tests and Allure Report

on:
  push:
    branches: [ dev, main ]
  workflow_dispatch:
    inputs:
      run_ui:
        description: "Run UI tests"
        required: false
        default: "false"

jobs:
  dev-tests:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: |
          dotnet restore SocksShoppingStore/SocksShoppingStore.csproj
          dotnet restore SocksShoppingStore.Tests/SocksShoppingStore.Tests.csproj
      - name: Run fast tests (Unit + Integration + API-Smoke)
        env:
          BASE_URL: http://127.0.0.1:5123
          USE_TEST_FACTORY: '1'
          RUN_UI_TESTS: '0'
        run: |
          dotnet test SocksShoppingStore.Tests/SocksShoppingStore.Tests.csproj -c Release --filter "TestCategory=Unit|TestCategory=Integration|TestCategory=API-Smoke" --logger "trx;LogFileName=dev.trx"
      - name: Integration coverage (scoped)
        shell: bash
        env:
          USE_TEST_FACTORY: '1'
        run: |
          dotnet test SocksShoppingStore.Tests/SocksShoppingStore.Tests.csproj -c Release \
            --filter "TestCategory=Integration" \
            --settings coverlet.integration.runsettings
      - name: API coverage (scoped via Include)
        shell: bash
        env:
          USE_TEST_FACTORY: '1'
        run: |
          dotnet test SocksShoppingStore.Tests/SocksShoppingStore.Tests.csproj -c Release \
            --filter "TestCategory=API-Smoke" \
            --settings coverlet.api.runsettings \
            --results-directory SocksShoppingStore.Tests/TestResults/CoverageApi
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-dev
          path: |
            allure-results
            **/allure-results
      - name: Upload Integration coverage (Cobertura)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration-dev
          path: |
            **/TestResults/**/coverage.cobertura.xml
      - name: Upload API coverage (Cobertura)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api-dev
          path: |
            **/TestResults/CoverageApi/**/coverage.cobertura.xml

  main-tests:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: |
          dotnet restore SocksShoppingStore/SocksShoppingStore.csproj
          dotnet restore SocksShoppingStore.Tests/SocksShoppingStore.Tests.csproj
      - name: Install coverlet.console tool
        run: dotnet tool update --global coverlet.console
      - name: Start app (HTTP)
        env:
          ASPNETCORE_ENVIRONMENT: Development
          DOTNET_ENVIRONMENT: Development
          RateLimiting__GlobalPerMinute: '1000'
          RateLimiting__ApiPerMinute: '1000'
          FreeTier__Enabled: 'false'
        run: |
          # Build first to surface compile errors in logs
          dotnet build SocksShoppingStore/SocksShoppingStore.csproj -c Release
          # Start app and capture logs
          nohup bash -c "dotnet run -c Release --project SocksShoppingStore/SocksShoppingStore.csproj --urls http://127.0.0.1:5123 --no-launch-profile" > app.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:5123/healthz" >/dev/null; then echo up; break; fi
            sleep 1
          done
          if ! curl -fsS "http://127.0.0.1:5123/healthz" >/dev/null; then
            echo 'App failed to start'; echo '--- app.log (tail) ---'; tail -n 200 app.log || true; exit 1;
          fi
      - name: Run non-UI tests (coverage)
        env:
          BASE_URL: http://127.0.0.1:5123
          RUN_UI_TESTS: '0'
          IGNORE_CERT_ERRORS: '0'
          USE_TEST_FACTORY: '1'
        run: |
          dotnet test SocksShoppingStore.Tests/SocksShoppingStore.Tests.csproj -c Release \
            --filter "TestCategory=Unit|TestCategory=Integration|TestCategory=API-Smoke" \
            --logger "trx;LogFileName=main.trx" \
            --settings coverlet.runsettings \
            --results-directory SocksShoppingStore.Tests/TestResults/Coverage
      - name: Run UI smoke tests (no coverage)
        env:
          BASE_URL: http://127.0.0.1:5123
          RUN_UI_TESTS: '1'
          IGNORE_CERT_ERRORS: '0'
          USE_TEST_FACTORY: '0'
        run: |
          dotnet test SocksShoppingStore.Tests/SocksShoppingStore.Tests.csproj -c Release \
            --filter "TestCategory=UI-Smoke" \
            --logger "trx;LogFileName=ui.trx" \
            --results-directory SocksShoppingStore.Tests/TestResults/UI
      - name: Aggregate Allure results
        shell: bash
        run: |
          rm -rf allure-results || true
          mkdir -p allure-results
          # Copy all allure-results produced by tests into a single folder
          find . -type d -name "allure-results" | while read d; do
            cp -r "$d"/. allure-results/ || true
          done
          echo "Aggregated files:"; ls -la allure-results || true
      - name: UI coverage (instrument server with coverlet) and run UI smoke
        if: success()
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          dotnet build SocksShoppingStore/SocksShoppingStore.csproj -c Release
          COVERLET=~/.dotnet/tools/coverlet
          APPDLL="SocksShoppingStore/bin/Release/net8.0/SocksShoppingStore.dll"
          $COVERLET "$APPDLL" \
            --target "dotnet" \
            --targetargs "$APPDLL --urls http://127.0.0.1:5123" \
            --format cobertura \
            --output "coverage-ui/coverage.cobertura.xml" \
            --include "[SocksShoppingStore]SocksShoppingStore.Controllers.*;[SocksShoppingStore]SocksShoppingStore.Services.*;[SocksShoppingStore]SocksShoppingStore.Data.*;[SocksShoppingStore]SocksShoppingStore.Middleware.*;[SocksShoppingStore]SocksShoppingStore.RequestMetrics*" \
            --exclude "[SocksShoppingStore]AspNetCoreGeneratedDocument.*" \
            --exclude-by-file "**/*.cshtml;**/Views/*" &
          # wait for health
          for i in {1..30}; do curl -fsSL "http://127.0.0.1:5123/healthz" >/dev/null && echo up && break || sleep 1; done
          BASE_URL=http://127.0.0.1:5123 RUN_UI_TESTS=1 IGNORE_CERT_ERRORS=0 USE_TEST_FACTORY=0 \
          dotnet test SocksShoppingStore.Tests/SocksShoppingStore.Tests.csproj -c Release --filter "TestCategory=UI-Smoke" --logger "trx;LogFileName=ui-coverage.trx"
          # stop server (coverlet target)
          pkill -f "SocksShoppingStore.dll" || true
      - name: Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@v1.8
        with:
          allure_results: allure-results
          allure_report: allure-report
          github_run_num: ${{ github.run_number }}
      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: success()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages
      - name: Verify Allure Pages
        if: success()
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          REPO_NAME=${GITHUB_REPOSITORY#*/}
          URL="https://${OWNER}.github.io/${REPO_NAME}"
          echo "Checking ${URL}..."
          for i in {1..20}; do
            if curl -fsSL "$URL/index.html" >/dev/null; then echo "Allure available at $URL"; exit 0; fi
            sleep 3
          done
          echo "Allure report not reachable at $URL" >&2
          exit 1
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-main
          path: |
            SocksShoppingStore.Tests/TestResults/Coverage
            **/coverage.opencover.xml
            coverage-ui/coverage.cobertura.xml
      - name: Upload TRX (non-UI + UI)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trx-main
          path: |
            SocksShoppingStore.Tests/TestResults/Coverage/main.trx
            SocksShoppingStore.Tests/TestResults/UI/ui.trx

  manual-ui:
    if: github.event_name == 'workflow_dispatch' && inputs.run_ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: |
          dotnet restore SocksShoppingStore/SocksShoppingStore.csproj
          dotnet restore SocksShoppingStore.Tests/SocksShoppingStore.Tests.csproj
      - name: Start app (HTTP)
        run: |
          dotnet build SocksShoppingStore/SocksShoppingStore.csproj -c Release
          nohup bash -c "dotnet run -c Release --project SocksShoppingStore/SocksShoppingStore.csproj --urls http://127.0.0.1:5123 --no-launch-profile" > app.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:5123/healthz" >/dev/null; then echo up; break; fi
            sleep 1
          done
          if ! curl -fsS "http://127.0.0.1:5123/healthz" >/dev/null; then
            echo 'App failed to start'; echo '--- app.log (tail) ---'; tail -n 200 app.log || true; exit 1;
          fi
      - name: Run UI smoke tests
        env:
          BASE_URL: http://127.0.0.1:5123
          RUN_UI_TESTS: '1'
          IGNORE_CERT_ERRORS: '0'
        run: |
          dotnet test SocksShoppingStore.Tests/SocksShoppingStore.Tests.csproj -c Release --filter "TestCategory=UI-Smoke" --logger "trx;LogFileName=ui.trx"
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui
          path: |
            allure-results
            **/allure-results

